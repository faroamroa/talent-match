[project]
name = "talentmatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FernandoRoa", email = "faroamroa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "docx2python>=3.7.1",
    "instructor>=1.17.0",
    "mammoth>=1.13.0",
    "openai>=3.3.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
talentmatch = "talentmatch:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
